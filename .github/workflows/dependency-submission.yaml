name: Dependency submission

on:
  push:
    branches: [main]
  schedule:
    - cron: '53 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit:
    # No PR event, untrusted ref, PR artifact or shared cache may enter this job.
    if: github.ref == 'refs/heads/main' && github.repository == 'OWASP/owasp-java-encoder'
    name: Dependencies (${{ matrix.graph }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph: libraries
            profile: ''
          - graph: jakarta-app
            profile: -PtestJakarta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check versions and isolate Maven storage
        run: |
          python3 scripts/check-ci-version.py --ref "$GITHUB_REF"
          echo "MAVEN_OPTS=-Dmaven.repo.local=$RUNNER_TEMP/m2" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Submit resolved runtime and test graph
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          # Package in the same invocation so the optional app resolves reactor JARs.
          maven-args: -B -ntp ${{ matrix.profile }} -DskipTests package
          correlator: encoder-${{ matrix.graph }}
          # Match build-dependency-snapshot.py: GitHub merges correlators from one
          # detector, but selects between different detectors for the same POM.
          # Separate detectors would hide runtime dependencies behind build ones.
          detector-name: encoder-maven-build-graph
          detector-version: '1.0.0'
          detector-url: https://github.com/OWASP/owasp-java-encoder
      - name: Resolve build plugins and their dependencies
        env:
          PROFILE: ${{ matrix.profile }}
        run: mvn -B -ntp ${PROFILE:+"$PROFILE"} org.apache.maven.plugins:maven-dependency-plugin:3.9.0:resolve-plugins -DoutputFile=target/build-dependencies.txt
      - name: Submit build graph
        env:
          GH_TOKEN: ${{ github.token }}
          GRAPH: ${{ matrix.graph }}
        run: |
          python3 scripts/build-dependency-snapshot.py --correlator "encoder-build-$GRAPH" --output target/build-snapshot.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input target/build-snapshot.json
      - name: Preserve resolved graphs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-graphs-${{ matrix.graph }}
          path: |
            **/target/*dependency*.json
            **/target/build-dependencies.txt
            target/build-snapshot.json
