name: Dependency submission

on:
  push:
    branches: [main]
  schedule:
    - cron: '53 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit:
    # No PR event, untrusted ref, PR artifact or shared cache may enter this job.
    if: github.ref == 'refs/heads/main' && github.repository == 'OWASP/owasp-java-encoder'
    name: Dependencies (${{ matrix.graph }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph: libraries
            profile: ''
            plugins: maven-clean-plugin,maven-enforcer-plugin,maven-checkstyle-plugin,maven-compiler-plugin,maven-bundle-plugin,jacoco-maven-plugin,maven-surefire-plugin,maven-resources-plugin,maven-jar-plugin,build-helper-maven-plugin,maven-source-plugin,maven-javadoc-plugin,exec-maven-plugin,maven-failsafe-plugin,maven-antrun-plugin,maven-dependency-plugin,maven-help-plugin,animal-sniffer-maven-plugin,maven-install-plugin
          - graph: jakarta-app
            profile: -PtestJakarta
            plugins: maven-clean-plugin,maven-enforcer-plugin,maven-checkstyle-plugin,maven-compiler-plugin,maven-bundle-plugin,jacoco-maven-plugin,maven-surefire-plugin,maven-resources-plugin,maven-jar-plugin,build-helper-maven-plugin,maven-source-plugin,maven-javadoc-plugin,exec-maven-plugin,maven-failsafe-plugin,maven-antrun-plugin,maven-dependency-plugin,maven-help-plugin,animal-sniffer-maven-plugin,maven-install-plugin
            app_plugins: maven-clean-plugin,maven-enforcer-plugin,maven-checkstyle-plugin,maven-compiler-plugin,maven-surefire-plugin,maven-failsafe-plugin,maven-resources-plugin,maven-war-plugin,spring-boot-maven-plugin,maven-dependency-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check versions and isolate Maven storage
        run: |
          python3 scripts/check-ci-version.py --ref "$GITHUB_REF"
          echo "MAVEN_OPTS=-Dmaven.repo.local=$RUNNER_TEMP/m2" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Submit resolved runtime and test graph
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          # Package in the same invocation so the optional app resolves reactor JARs.
          maven-args: -B -ntp ${{ matrix.profile }} -DskipTests package
          correlator: encoder-${{ matrix.graph }}
          # Match build-dependency-snapshot.py: GitHub merges correlators from one
          # detector, but selects between different detectors for the same POM.
          # Separate detectors would hide runtime dependencies behind build ones.
          detector-name: encoder-maven-build-graph
          detector-version: '1.0.0'
          detector-url: https://github.com/OWASP/owasp-java-encoder
      - name: Resolve shared library build plugins and their dependencies
        env:
          PLUGINS: ${{ matrix.plugins }}
        run: ./mvnw -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.11.0:resolve-plugins -DincludeArtifactIds="$PLUGINS" -DoutputFile=target/build-dependencies.txt
      - name: Resolve only the optional app plugins invoked by its package gate
        if: matrix.graph == 'jakarta-app'
        env:
          APP_PLUGINS: ${{ matrix.app_plugins }}
        run: ./mvnw -B -ntp -f jakarta-test/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:resolve-plugins -DincludeArtifactIds="$APP_PLUGINS" -DoutputFile=target/build-dependencies.txt
      - name: Resolve the compatibility fixture downloader and its dependencies
        run: ./mvnw -B -ntp -f compatibility/dependencies/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:resolve-plugins -DincludeArtifactIds=maven-dependency-plugin -DoutputFile=target/build-dependencies.txt
      - name: Submit build graph
        env:
          GH_TOKEN: ${{ github.token }}
          GRAPH: ${{ matrix.graph }}
        run: |
          python3 scripts/build-dependency-snapshot.py --correlator "encoder-build-$GRAPH" --output target/build-snapshot.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input target/build-snapshot.json
      - name: Resolve and submit the release plugin graph without signing or publishing
        if: matrix.graph == 'libraries'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./mvnw -B -ntp -Psign-artifacts dependency:resolve-plugins \
            -DincludeArtifactIds="${{ matrix.plugins }},maven-gpg-plugin,central-publishing-maven-plugin,maven-deploy-plugin" \
            -DoutputFile=target/build-dependencies.txt
          python3 scripts/build-dependency-snapshot.py --correlator encoder-build-release --output target/release-build-snapshot.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input target/release-build-snapshot.json
      - name: Preserve resolved graphs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-graphs-${{ matrix.graph }}
          path: |
            **/target/*dependency*.json
            **/target/build-dependencies.txt
            target/*build-snapshot.json
