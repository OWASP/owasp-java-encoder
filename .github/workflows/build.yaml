name: Java CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Run build
      run: mvn -B -ntp install -PtestJakarta

  esapi-compatibility:
    name: ESAPI ${{ matrix.esapi-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        esapi-version:
          - '2.5.1.0'
          - '2.5.2.0'
          - '2.5.3.0'
          - '2.5.3.1'
          - '2.5.4.0'
          - '2.5.5.0'
          - '2.6.0.0'
          - '2.6.1.0'
          - '2.6.2.0'
          - '2.7.0.0'
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Test ESAPI compatibility
      run: mvn -B -ntp -pl esapi -am verify -Desapi.version=${{ matrix.esapi-version }}
