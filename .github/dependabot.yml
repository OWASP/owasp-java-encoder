version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /
      - /core
      - /jsp
      - /jakarta
      - /esapi
      - /jakarta-test
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      maven-dependencies:
        applies-to: version-updates
        patterns: ['*']
        # These need individual compatibility review, not a mixed version PR.
        # Group exclusions do not ignore updates or suppress security proposals.
        # Rationale and revisit conditions: DEPENDENCY_DECISIONS.md.
        exclude-patterns:
          - org.apache.felix:maven-bundle-plugin
          - com.puppycrawl.tools:checkstyle
          - org.codehaus.plexus:plexus-utils
          - javax.servlet.jsp:javax.servlet.jsp-api
          - javax.servlet:javax.servlet-api
          - javax.el:javax.el-api
          - jakarta.servlet.jsp:jakarta.servlet.jsp-api
          - jakarta.servlet:jakarta.servlet-api
          - jakarta.el:jakarta.el-api
          - org.apache.tomcat.embed:tomcat-embed-jasper
          - org.apache.tomcat:tomcat-annotations-api
      maven-security:
        applies-to: security-updates
        patterns: ['*']
    # The Felix 5.6.12 fixture is the intentional OSGi R6/Java 8 baseline.
    # Review alerts by execution scope; never dismiss or upgrade it blindly.
    ignore:
      - dependency-name: org.apache.felix:org.apache.felix.framework
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
